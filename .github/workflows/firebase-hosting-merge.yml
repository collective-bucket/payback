name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: collective-bucket
          workload_identity_provider: projects/239510573325/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-actions-deployer@collective-bucket.iam.gserviceaccount.com
          token_format: access_token
      - run: npm ci
      - run: npm run check
      - run: npm run stamp
      - run: npx firebase-tools deploy --only hosting:payback,firestore:rules --token "${{ steps.auth.outputs.access_token }}" --non-interactive
