<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yolculuk özeti | Payback</title>
  <meta name="description" content="Paylaşılan yolculuk harcamaları ve hesap özeti." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="https://collectivebucket.com/assets/shell.css" />
</head>
<body>
  <header data-cb-shell="header" data-cb-shell-app="Payback" data-cb-shell-home="/"></header>

  <main>
    <div class="wrap">
      <section class="hero">
        <div>
          <h1 id="summary-title">Yolculuk özeti</h1>
          <p id="summary-note"></p>
        </div>
        <div class="actions hero-actions" id="summary-actions" hidden>
          <button id="copy-summary-link" class="btn btn-ghost" type="button">Linki kopyala</button>
          <button id="share-summary" class="btn btn-primary" type="button">Linki paylaş</button>
        </div>
      </section>

      <div id="summary-content" hidden>
        <section class="panel">
          <h2>Harcamalar</h2>
          <ul id="summary-expenses" class="list"></ul>
        </section>

        <section class="panel">
          <h2>Kişiler</h2>
          <ul id="summary-balances" class="list"></ul>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Ödemeler</h2>
            <select id="payment-person-filter" aria-label="Kişiye göre ödemeler"></select>
          </div>
          <div id="summary-payments"></div>
        </section>
      </div>

      <p id="summary-message" class="message" role="status"></p>
    </div>
  </main>

  <footer data-cb-shell="footer"></footer>

  <script src="https://collectivebucket.com/assets/shell.js" defer></script>
  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/trips.js" defer></script>
  <script src="/assets/settle.js" defer></script>
  <script src="/assets/nav.js" defer></script>
  <script src="/assets/summary.js" defer></script>
</body>
</html>
