<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yolculuk özeti | Payback</title>
  <meta name="description" content="Paylaşılan yolculuk harcamaları ve hesap özeti." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="" />
        <span>Payback</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Menüyü aç" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-cta">
        <a class="btn btn-ghost" href="/">Payback’e git</a>
        <div class="cb-auth-controls" data-cb-auth></div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <p class="meta" id="summary-status"></p>
      <section class="hero">
        <div>
          <h1 id="summary-title">Yolculuk özeti</h1>
          <p id="summary-note"></p>
        </div>
      </section>

      <div id="summary-content" hidden>
        <section class="panel">
          <h2>Harcamalar</h2>
          <ul id="summary-expenses" class="list"></ul>
        </section>

        <section class="panel">
          <div class="settle-grid">
            <div>
              <h2>Durum</h2>
              <div id="summary-balances"></div>
            </div>
            <div>
              <h2>Kim kime ne verir</h2>
              <div id="summary-payments"></div>
            </div>
          </div>
        </section>
      </div>

      <p id="summary-message" class="message" role="status"></p>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>Collective Bucket · Payback</span>
      <a href="https://collectivebucket.com">collectivebucket.com</a>
    </div>
  </footer>

  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/trips.js" defer></script>
  <script src="/assets/settle.js" defer></script>
  <script src="/assets/nav.js" defer></script>
  <script src="/assets/summary.js" defer></script>
</body>
</html>
