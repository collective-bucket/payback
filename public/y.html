<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yolculuk | Payback</title>
  <meta name="description" content="Yolculuk harcamaları ve hesap özeti." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="https://collectivebucket.com/assets/shell.css" />
</head>
<body>
  <header data-cb-shell="header" data-cb-shell-app="Payback" data-cb-shell-home="/"></header>

  <main>
    <div class="wrap">
      <section id="access-prompt" class="panel auth-prompt" hidden>
        <h2 id="access-title">Giriş gerekli</h2>
        <p id="access-text">Bu yolculuğu düzenlemek için sahibi olarak giriş yap.</p>
        <a id="access-login" class="btn btn-primary" href="#">Giriş yap</a>
      </section>

      <div id="trip-content" hidden>
        <section class="hero">
          <div>
            <h1 id="trip-title">Yolculuk</h1>
            <p id="trip-note"></p>
          </div>
          <div class="actions hero-actions" id="owner-actions" hidden>
            <button id="delete-trip" class="btn btn-ghost danger" type="button">Yolculuğu sil</button>
            <a id="settle-btn" class="btn btn-primary" href="#">Hesabı çıkar</a>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Kişiler</h2>
            <button id="person-toggle" class="btn btn-primary btn-icon" type="button" hidden aria-label="Kişi ekle" title="Kişi ekle">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <ul id="people-list" class="list"></ul>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Harcamalar</h2>
            <button id="expense-toggle" class="btn btn-primary btn-icon" type="button" hidden aria-label="Harcama ekle" title="Harcama ekle">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <ul id="expense-list" class="list"></ul>
        </section>

        <p id="trip-message" class="message" role="status"></p>
      </div>
    </div>
  </main>

  <dialog id="person-dialog" class="modal">
    <form id="person-form" class="modal-form" method="dialog">
      <div class="modal-header">
        <h2 id="person-dialog-title">Kişi ekle</h2>
        <button class="btn btn-ghost btn-icon" type="button" data-close-dialog aria-label="Kapat" title="Kapat">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-content">
        <label for="person-name">Ad</label>
        <input
          id="person-name"
          type="text"
          maxlength="60"
          placeholder="Kişi adı"
          aria-label="Kişi adı"
          required
        />
        <p id="person-message" class="message" role="status"></p>
      </div>
      <div class="modal-actions">
        <button id="person-delete" class="btn btn-ghost danger" type="button" hidden>Sil</button>
        <button class="btn btn-ghost" type="button" data-close-dialog>Vazgeç</button>
        <button id="person-submit" class="btn btn-primary" type="submit">Kişi ekle</button>
      </div>
    </form>
  </dialog>

  <dialog id="expense-dialog" class="modal">
    <form id="expense-form" class="modal-form" method="dialog">
      <div class="modal-header">
        <h2 id="expense-dialog-title">Harcama ekle</h2>
        <button class="btn btn-ghost btn-icon" type="button" data-close-dialog aria-label="Kapat" title="Kapat">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-content">
        <div class="field-grid">
          <div>
            <label for="expense-label">Açıklama</label>
            <input id="expense-label" type="text" maxlength="120" placeholder="Benzin" required />
          </div>
          <div>
            <label for="expense-amount">Tutar (₺)</label>
            <input id="expense-amount" type="number" min="0.01" step="0.01" required />
          </div>
        </div>

        <label for="expense-payer">Ödeyen</label>
        <select id="expense-payer" required></select>

        <div class="include-head">
          <label>Dahil kişiler</label>
          <div class="include-tools">
            <button id="include-all" class="btn btn-ghost btn-tiny" type="button">Tümü</button>
            <button id="include-none" class="btn btn-ghost btn-tiny" type="button">Hiçbiri</button>
          </div>
        </div>
        <div id="expense-people" class="person-chips"></div>
        <p id="expense-message" class="message" role="status"></p>
      </div>
      <div class="modal-actions">
        <button id="expense-delete" class="btn btn-ghost danger" type="button" hidden>Sil</button>
        <button class="btn btn-ghost" type="button" data-close-dialog>Vazgeç</button>
        <button id="expense-submit" class="btn btn-primary" type="submit">Harcama ekle</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="modal">
    <div class="modal-body">
      <div class="modal-header">
        <h2 id="confirm-title">Silinsin mi?</h2>
        <button class="btn btn-ghost btn-icon" type="button" data-close-dialog aria-label="Kapat" title="Kapat">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-content">
        <p id="confirm-text" class="modal-text"></p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close-dialog>Vazgeç</button>
        <button id="confirm-delete" class="btn btn-danger-fill" type="button">Sil</button>
      </div>
    </div>
  </dialog>

  <footer data-cb-shell="footer"></footer>

  <script src="https://collectivebucket.com/assets/shell.js" defer></script>
  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/trips.js" defer></script>
  <script src="/assets/nav.js" defer></script>
  <script src="/assets/trip.js" defer></script>
</body>
</html>
