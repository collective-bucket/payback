<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yolculuk | Payback</title>
  <meta name="description" content="Yolculuk harcamaları ve hesap özeti." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="" />
        <span>Payback</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Menüyü aç" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-cta">
        <a class="btn btn-ghost" href="/">Yolculuklarım</a>
        <div class="cb-auth-controls" data-cb-auth></div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section id="access-prompt" class="panel auth-prompt" hidden>
        <h2 id="access-title">Giriş gerekli</h2>
        <p id="access-text">Bu yolculuğu düzenlemek için sahibi olarak giriş yap.</p>
        <a id="access-login" class="btn btn-primary" href="#">Giriş yap</a>
      </section>

      <div id="trip-content" hidden>
        <section class="hero">
          <div>
            <h1 id="trip-title">Yolculuk</h1>
            <p id="trip-note"></p>
          </div>
          <div class="actions hero-actions" id="owner-actions" hidden>
            <a id="settle-btn" class="btn btn-primary" href="#">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v3H7V4zm-1 5h12v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9zm4 3h6v2H10v-2zm0 4h6v2H10v-2z"/></svg>
              <span>Hesabı çıkar</span>
            </a>
            <button id="delete-trip" class="btn btn-ghost danger" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l1 2h4v2H4V6h4l1-2zm1 6h2v8h-2v-8zm4 0h2v8h-2v-8zM7 10h2v8H7v-8z"/></svg>
              <span>Yolculuğu sil</span>
            </button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Kişiler</h2>
            <button id="person-toggle" class="btn btn-primary btn-icon" type="button" hidden aria-label="Kişi ekle" title="Kişi ekle">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <form id="person-form" class="compact-row" hidden>
            <input
              id="person-name"
              type="text"
              maxlength="60"
              placeholder="Kişi adı"
              aria-label="Kişi adı"
              required
            />
            <button id="person-submit" class="btn btn-primary btn-icon" type="submit" aria-label="Ekle" title="Ekle">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button id="person-cancel" class="btn btn-ghost btn-icon" type="button" aria-label="Vazgeç" title="Vazgeç">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </form>
          <ul id="people-list" class="list"></ul>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Harcamalar</h2>
            <button id="expense-toggle" class="btn btn-primary btn-icon" type="button" hidden aria-label="Harcama ekle" title="Harcama ekle">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <form id="expense-form" class="compact-form" hidden>
            <div class="field-grid">
              <div>
                <label for="expense-label">Açıklama</label>
                <input id="expense-label" type="text" maxlength="120" placeholder="Benzin" required />
              </div>
              <div>
                <label for="expense-amount">Tutar (₺)</label>
                <input id="expense-amount" type="number" min="0.01" step="0.01" required />
              </div>
            </div>

            <label for="expense-payer">Ödeyen</label>
            <select id="expense-payer" required></select>

            <div class="include-head">
              <label>Dahil kişiler</label>
              <div class="include-tools">
                <button id="include-all" class="btn btn-ghost btn-tiny" type="button">Tümü</button>
                <button id="include-none" class="btn btn-ghost btn-tiny" type="button">Hiçbiri</button>
              </div>
            </div>
            <div id="expense-people" class="person-chips"></div>

            <div class="actions">
              <button id="expense-submit" class="btn btn-primary" type="submit">Harcama ekle</button>
              <button id="expense-cancel" class="btn btn-ghost btn-icon" type="button" aria-label="Vazgeç" title="Vazgeç">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>
          </form>
          <ul id="expense-list" class="list"></ul>
        </section>

        <p id="trip-message" class="message" role="status"></p>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>Collective Bucket · Payback</span>
      <a href="/">Yolculuklarım</a>
    </div>
  </footer>

  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/trips.js" defer></script>
  <script src="/assets/nav.js" defer></script>
  <script src="/assets/trip.js" defer></script>
</body>
</html>
