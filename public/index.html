<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payback | Collective Bucket</title>
  <meta name="description" content="Yolculuk harcamalarını kişiler arasında denkleştir." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="" />
        <span>Payback</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Menüyü aç" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-cta">
        <div class="cb-auth-controls" data-cb-auth></div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="hero">
        <div>
          <h1>Yolculuklarım</h1>
          <p>
            Harcamaları not et, kişilere böl, hesabı çıkar.
            Sonuç: kim kime ne verir.
          </p>
        </div>
        <div class="hero-toolbar">
          <div class="meta" id="home-status"></div>
          <button id="new-trip-toggle" class="btn btn-primary" type="button" hidden>
            Yolculuk ekle
          </button>
        </div>
      </section>

      <div id="login-prompt" class="login-action" hidden>
        <a id="login-link" class="btn btn-primary" href="#">Giriş yap</a>
      </div>

      <section>
        <div id="trip-list" class="trip-grid"></div>
      </section>

      <p id="home-message" class="message" role="status"></p>
    </div>
  </main>

  <dialog id="trip-create-dialog" class="modal">
    <form id="create-form" class="modal-form" method="dialog">
      <div class="modal-header">
        <h2>Yolculuk ekle</h2>
        <button id="cancel-trip" class="btn btn-ghost btn-icon" type="button" aria-label="Kapat" title="Kapat">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-content">
        <label for="trip-title">Ad</label>
        <input id="trip-title" name="title" type="text" maxlength="120" required placeholder="Kapadokya" />

        <label for="trip-note">Not (opsiyonel)</label>
        <textarea id="trip-note" name="note" maxlength="500" placeholder="Kısa açıklama"></textarea>
        <p id="create-message" class="message" role="status"></p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close-dialog>Vazgeç</button>
        <button class="btn btn-primary" type="submit">Oluştur</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="modal">
    <div class="modal-body">
      <div class="modal-header">
        <h2 id="confirm-title">Silinsin mi?</h2>
        <button class="btn btn-ghost btn-icon" type="button" data-close-dialog aria-label="Kapat" title="Kapat">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-content">
        <p id="confirm-text" class="modal-text"></p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close-dialog>Vazgeç</button>
        <button id="confirm-delete" class="btn btn-danger-fill" type="button">Sil</button>
      </div>
    </div>
  </dialog>

  <footer>
    <div class="wrap">
      <span>Payback</span>
      <a href="https://collectivebucket.com">collectivebucket.com</a>
    </div>
  </footer>

  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/trips.js" defer></script>
  <script src="/assets/nav.js" defer></script>
  <script src="/assets/home.js" defer></script>
</body>
</html>
